{% extends "base.html" %}

{% block footer %}
  {{ super() }}
  <div style="text-align:center; padding:10px;">
    <img src="{{ base_url }}/img/mooc.png" alt="Sea-Forward Footer Logo" height="40">
    <p>© {{ config.extra.year }} Sea-Forward — Documentation générée avec MkDocs</p>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Phase 1 et Phase 7 démarrent fermées, mais restent cliquables ensuite
      const menuItems = document.querySelectorAll('.wy-menu-vertical li.toctree-l1');
      menuItems.forEach(item => {
        const link = item.querySelector('> a');
        if (link && (link.textContent.includes('Phase 1') || link.textContent.includes('Phase 7'))) {
          item.classList.remove('current');
        }
      });
    });
  </script>
{% endblock %}
