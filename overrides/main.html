{% extends "base.html" %}

{% block footer %}
  {{ super() }}
  <div style="text-align:center; padding:10px;">
    <img src="{{ base_url }}/img/mooc.png" alt="Sea-Forward Footer Logo" height="40">
    <p>© {{ config.extra.year }} Sea-Forward — Documentation générée avec MkDocs</p>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('li.navtree.label').forEach(function (label) {
        var groupLi = label.nextElementSibling;
        if (!groupLi || !groupLi.classList.contains('group')) return;

        var submenu = groupLi.querySelector(':scope > ul.navtree');
        if (!submenu) return;

        label.addEventListener('click', function () {
          submenu.classList.toggle('js-open');
        });
      });
    });
  </script>
{% endblock %}
