{% extends "base.html" %}

{% block footer %}
{{ super() }}
<div style="text-align:center; padding:10px;">
  <img src="{{ base_url }}/img/mooc.png" alt="Sea-Forward Footer Logo" height="40">
  <p>© {{ config.extra.year }} Sea-Forward — Documentation générée avec MkDocs</p>
</div>
{% endblock %}

{% block libs %}
{{ super() }}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 1. Au chargement : ouvre automatiquement la phase qui contient la page active
    document.querySelectorAll('li.navtree.group > ul.navtree.current').forEach(function (submenu) {
      submenu.classList.add('js-open');
    });

    // 2. Attache le comportement accordéon au clic sur chaque titre
    document.querySelectorAll('li.navtree.label').forEach(function (label) {
      var groupLi = label.nextElementSibling;
      if (!groupLi || !groupLi.classList.contains('group')) return;

      var submenu = groupLi.querySelector(':scope > ul.navtree');
      if (!submenu) return;

      label.addEventListener('click', function () {
        var isTopLevelPhase = groupLi.classList.contains('toctree-l1');
        var willOpen = !submenu.classList.contains('js-open');

        if (isTopLevelPhase) {
          document.querySelectorAll('li.navtree.group.toctree-l1 > ul.navtree.js-open').forEach(function (openSubmenu) {
            if (openSubmenu !== submenu) {
              openSubmenu.classList.remove('js-open');
            }
          });
        }

        submenu.classList.toggle('js-open', willOpen);
      });
    });
  });
</script>
{% endblock %}
