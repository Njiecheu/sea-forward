{% extends "base.html" %}

{% block footer %}
  {{ super() }}
  <div style="text-align:center; padding:10px;">
    <img src="{{ base_url }}/img/mooc.png" alt="Sea-Forward Footer Logo" height="40">
    <p>© {{ config.extra.year }} Sea-Forward — Documentation générée avec MkDocs</p>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Collapse all navigation items by default
      const details = document.querySelectorAll('nav details');
      details.forEach(detail => {
        detail.removeAttribute('open');
      });
    });
  </script>
{% endblock %}
