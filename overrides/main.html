{% extends "base.html" %}

{% block footer %}
  {{ super() }}
  <div style="text-align:center; padding:10px;">
    <img src="{{ base_url }}/img/mooc.png" alt="Sea-Forward Footer Logo" height="40">
    <p>© {{ config.extra.year }} Sea-Forward — Documentation générée avec MkDocs</p>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sections = document.querySelectorAll('.wy-menu-vertical li.toctree-l1');

      sections.forEach(function (item) {
        const submenu = item.querySelector('> ul');
        if (!submenu) return; // pas de sous-menu, rien à déplier

        const header = item.querySelector('> a') || item.querySelector('> span');
        if (!header) return;

        header.addEventListener('click', function (e) {
          const href = header.getAttribute('href');
          const isRealLink = header.tagName === 'A' && href && href !== '#';

          if (!isRealLink) {
            e.preventDefault(); // évite un saut de page inutile si c'est juste un titre de catégorie
          }

          item.classList.toggle('menu-open');
        });
      });
    });
  </script>
{% endblock %}
